# Jamba2 3B Continued Pretraining - Turkish
# Optimized defaults for RTX 6000 Ada 48GB

# === Model ===
model:
  name: "ai21labs/AI21-Jamba2-3B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"  # safer than flash-attn for first deployment
  use_mamba_kernels: true
  use_cache: false

# === Tokenizer ===
tokenizer:
  path: "./customtokenizer"

# === Data ===
data:
  hf_dataset_id: "serda-dev/turkish-raw-text-cleaned"
  hf_cache_dir: "./dataset/hf-cache"
  dataset_dir: "./dataset"
  file_pattern: "*.jsonl"
  text_field: "text"
  min_text_length: 50  # chars
  strip_legacy_endoftext: true
  seq_len: 1024
  num_workers: 2
  prefetch_factor: 2

# === Training ===
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 8  # effective batch = 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  max_grad_norm: 1.0
  gradient_checkpointing: true
  
  # Stopping conditions (whichever comes first)
  max_steps: 10000
  time_budget_seconds: 432000  # 120 hours; interruptible hosts will still stop earlier if preempted
  
  # Mixed precision
  mixed_precision: true
  amp_dtype: "bfloat16"
  
  # Optimizer: 8-bit AdamW is the default to keep 3B CPT comfortable on 48GB VRAM
  optimizer: "adamw_8bit"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  empty_cache_every_steps: 50

# === Checkpointing ===
checkpointing:
  output_dir: "./output"
  checkpoint_every_steps: 100
  save_total_limit: 6  # keep a deeper history for preemptible hosts
  save_final: true

# === Logging ===
logging:
  log_every_steps: 10
  log_file: "training.log"
  log_json: true

# === Reproducibility ===
seed: 42
deterministic: false  # true may slow down training
