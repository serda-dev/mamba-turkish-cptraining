checkpointing:
  checkpoint_every_steps: 9999
  output_dir: ./output
  save_final: true
  save_total_limit: 3
data:
  dataset_dir: ./dataset
  file_pattern: '*.jsonl'
  min_text_length: 50
  num_workers: 2
  prefetch_factor: 2
  seq_len: 1024
  text_field: text
deterministic: false
logging:
  log_every_steps: 10
  log_file: training.log
  log_json: true
model:
  name: state-spaces/mamba-370m-hf
  torch_dtype: bfloat16
seed: 42
training:
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  amp_dtype: bfloat16
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-05
  max_grad_norm: 1.0
  max_steps: 5
  micro_batch_size: 1
  mixed_precision: true
  optimizer: adamw
  time_budget_seconds: 10800
  warmup_steps: 100
  weight_decay: 0.01
